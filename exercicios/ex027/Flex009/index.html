<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container {
            background-color: lightsalmon;

            display: flex;
            flex-flow: row wrap;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center; 
            flex-basis: 150px;
        }
    </style>
</head>
<body>
    <div class="container">
            <div class="item">A</div>
            <div class="item">BAINHAAAAAAA</div>
            <div class="item">C</div>
            <div class="item">DEdos mortais</div>
            <div class="item">E</div>
            <div class="item">FUEUFUEUFEUFUEFUEUF</div>
            <div class="item">Gay</div>
    </div>
</body>
</html>
